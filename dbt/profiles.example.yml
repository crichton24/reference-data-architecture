# Copy to ~/.dbt/profiles.yml (or dbt/profiles.yml, which is gitignored)
# and fill in. Never commit the filled-in version.
nyc_transit:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: nyc_transit
      schema: dev
      threads: 4

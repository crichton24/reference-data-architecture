[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Airflow DAGs legitimately import inside functions to keep parse time low.
"airflow/dags/*" = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["airflow/tests"]
